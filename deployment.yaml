apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - name: petclinic
        image: 605863933397.dkr.ecr.ap-northeast-1.amazonaws.com/user14-petclinic:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "mysql"
        # properties 파일에 적힌 이름과 정확히 맞춰줍니다.
        - name: MYSQL_URL
          value: "jdbc:mysql://user14-petclinic-db.ctqcq2c6mch7.ap-northeast-1.rds.amazonaws.com:3306/petclinic"
        - name: MYSQL_USER
          value: "petclinic"
        - name: MYSQL_PASS
          value: "petclinic1!"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

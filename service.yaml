apiVersion: v1
kind: Service
metadata:
  name: petclinic-svc
  namespace: petclinic
  annotations:
    # AWS에서 Network Load Balancer(NLB)를 생성하도록 설정
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: petclinic  # <--- 이 부분이 레이블 매칭 포인트입니다!
  ports:
  - name: http
    port: 80
    targetPort: 8080
